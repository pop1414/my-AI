services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: myai-pg
    environment:
      POSTGRES_DB: myai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d myai"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    container_name: myai-rustfs
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: Admin@123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    restart: always

volumes:
  pgdata:
  rustfs_data:
