services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: myai-pg
    environment:
      POSTGRES_DB: myai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d myai"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    container_name: myai-rustfs
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: Admin@123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    restart: always

  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: myai-docling-serve
    environment:
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_SHOW_VERSION_INFO: "true"
      TZ: Asia/Shanghai
    ports:
      - "5001:5001"
    volumes:
      - docling_model_cache:/root/.cache/docling
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/version', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m

volumes:
  pgdata:
  rustfs_data:
  docling_model_cache:
