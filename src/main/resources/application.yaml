spring:
  servlet:
    multipart:
      max-file-size: 50MB        # 单个文件的最大限制
      max-request-size: 50MB     # 整个请求（包含其他表单字段）的最大限制:
  application:
    name: my-AI
  datasource:
    url: ${PGVECTOR_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myai}
    username: ${PGVECTOR_DATASOURCE_USERNAME:admin}
    password: ${PGVECTOR_DATASOURCE_PASSWORD:admin}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  ai:
    dashscope:
      # 通过环境变量注入，避免把密钥写入仓库
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
    vectorstore:
      pgvector:
        # 表结构由 Flyway 统一管理，避免与应用启动时的自动建表逻辑冲突
        initialize-schema: false
        # 自动校验表结构
        schema-validation: true
        schema-name: public
        # 存储向量的表名
        table-name: vector_store
        # 推荐的高性能向量索引类型
        index-type: HNSW
        # 计算相似度的方式（余弦相似度）
        distance-type: COSINE_DISTANCE
        # 向量维度需与 embedding 模型输出一致（可按模型调整）
        dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1024}
        # 批量插入最大值：一次最多往数据库存 1 万条文本向量
        max-document-batch-size: 10000
        # 是否删除旧表
        remove-existing-vector-store-table: false

myai:
  auth:
    bootstrap-admin:
      # 空库启动时创建第一个默认工作区管理员；未配置用户名或密码时自动跳过
      username: ${MYAI_AUTH_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${MYAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${MYAI_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
  ingest:
    parser:
      # Tika 解析最大文本长度，防止异常文档输出过长文本导致内存风险
      max-text-length: ${INGEST_PARSER_MAX_TEXT_LENGTH:2000000}
      # 是否允许解析嵌入资源（默认关闭，避免图片/附件污染正文）
      parse-embedded-resource: ${INGEST_PARSER_PARSE_EMBEDDED_RESOURCE:false}
    storage:
      # 上传源文件本地落盘目录（可替换为对象存储适配器）
      root-dir: ${INGEST_STORAGE_ROOT_DIR:data/ingest}
      artifacts:
        # 是否保留 Tika 原始 XHTML 调试产物
        keep-raw-xhtml: ${INGEST_STORAGE_KEEP_RAW_XHTML:false}
        # 是否保留 cleaned.html 调试产物
        keep-cleaned-html: ${INGEST_STORAGE_KEEP_CLEANED_HTML:false}
        # 是否保留 processing_metadata 的文件化载体 parse-result.json
        keep-parse-result-json: ${INGEST_STORAGE_KEEP_PARSE_RESULT_JSON:true}
    chunk:
      # 文本分块参数（结构优先 + 长度兜底）
      chunk-size: ${INGEST_CHUNK_SIZE:500}
      overlap-size: ${INGEST_CHUNK_OVERLAP:100}
    worker:
      # 单进程异步 worker 开关
      enabled: ${INGEST_WORKER_ENABLED:true}
      # Worker 轮询间隔（毫秒）
      poll-delay-ms: ${INGEST_WORKER_POLL_DELAY_MS:5000}
    schema-check:
      # 启动时检查 ingest_documents 关键结构；不符合预期则拒绝启动
      enabled: ${INGEST_SCHEMA_CHECK_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
