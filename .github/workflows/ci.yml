# =============================================================================
# my-AI CI Pipeline
# -----------------------------------------------------------------------------
# Stage 1: Fast Feedback (< 2 min target) — parallel compile/test/lint
#   - backend-build: compile Java + unit tests (no DB required)
#   - frontend-build: tsc type check + Vite build + ESLint
# Stage 2: Integration Checks (optional/manual)
#   - integration-test: full backend test suite with PostgreSQL + S3 services
#   - e2e-test: Playwright E2E with live backend
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx1024m

jobs:
  # ===========================================================================
  # Stage 1: Fast Feedback
  # ===========================================================================

  backend-build:
    name: "Backend: Compile + Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile
        run: ./mvnw clean compile -B

      - name: Unit Tests (no DB)
        run: ./mvnw test -B "-Dtest=!MyAiApplicationTests"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: target/surefire-reports/
          retention-days: 7

  frontend-build:
    name: "Frontend: Type Check + Build + Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check + Build
        run: npm run build

      - name: Lint
        run: npm run lint

  # ===========================================================================
  # Stage 2: Integration / E2E (manual trigger or on main)
  # ===========================================================================

  integration-test:
    name: "Backend: Integration Tests (DB)"
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: myai
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d myai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      PGVECTOR_DATASOURCE_URL: jdbc:postgresql://localhost:5432/myai
      PGVECTOR_DATASOURCE_USERNAME: admin
      PGVECTOR_DATASOURCE_PASSWORD: admin
      MYAI_AUTH_BOOTSTRAP_ADMIN_USERNAME: admin
      MYAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD: admin123
      MYAI_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Admin
      INGEST_WORKER_ENABLED: "false"
      INGEST_STORAGE_TYPE: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Full Backend Tests
        run: ./mvnw test -B

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/surefire-reports/
          retention-days: 7

  e2e-test:
    name: "Frontend: Playwright E2E"
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: myai
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d myai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      PGVECTOR_DATASOURCE_URL: jdbc:postgresql://localhost:5432/myai
      PGVECTOR_DATASOURCE_USERNAME: admin
      PGVECTOR_DATASOURCE_PASSWORD: admin
      MYAI_AUTH_BOOTSTRAP_ADMIN_USERNAME: admin
      MYAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD: admin123
      MYAI_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Admin
      INGEST_WORKER_ENABLED: "false"
      INGEST_STORAGE_TYPE: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start Backend (background)
        run: ./mvnw spring-boot:run -B &
        env:
          INGEST_STORAGE_ROOT_DIR: /tmp/myai-e2e-storage

      - name: Wait for Backend Ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Run Playwright E2E Tests
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
