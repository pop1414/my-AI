# =============================================================================
# my-AI CI 流水线
# -----------------------------------------------------------------------------
# 阶段 1：快速反馈（< 2 分钟）— 并行编译/测试/lint
#   - backend-build：Java 编译 + 单元测试（不需要数据库）
#   - frontend-build：tsc 类型检查 + Vite 构建 + ESLint
# 阶段 2：集成检查（仅 main 推送或手动触发）
#   - integration-test：完整后端测试 + PostgreSQL + S3 服务
#   - e2e-test：Playwright E2E 测试 + 实时后端
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx1024m

jobs:
  # ===========================================================================
  # 阶段 1：快速反馈
  # ===========================================================================

  backend-build:
    name: "后端：编译 + 单元测试"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 赋予 mvnw 执行权限
        run: chmod +x ./mvnw

      - name: 编译
        run: ./mvnw clean compile -B

      - name: 单元测试（不需要数据库）
        run: ./mvnw test -B -DexcludedGroups=integration

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 后端测试报告
          path: target/surefire-reports/
          retention-days: 7

  frontend-build:
    name: "前端：类型检查 + 构建 + Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      - name: 代码规范检查
        run: npm run lint

  # ===========================================================================
  # 阶段 2：集成测试 / E2E（仅 main 推送或手动触发）
  # ===========================================================================

  integration-test:
    name: "后端：集成测试（数据库）"
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: myai
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d myai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      PGVECTOR_DATASOURCE_URL: jdbc:postgresql://localhost:5432/myai
      PGVECTOR_DATASOURCE_USERNAME: admin
      PGVECTOR_DATASOURCE_PASSWORD: admin
      MYAI_AUTH_BOOTSTRAP_ADMIN_USERNAME: admin
      MYAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD: admin123
      MYAI_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Admin
      INGEST_WORKER_ENABLED: "false"
      INGEST_STORAGE_TYPE: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 赋予 mvnw 执行权限
        run: chmod +x ./mvnw

      - name: 完整后端测试
        run: ./mvnw test -B

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 集成测试报告
          path: target/surefire-reports/
          retention-days: 7

  e2e-test:
    name: "前端：Playwright E2E 测试"
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: myai
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d myai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      PGVECTOR_DATASOURCE_URL: jdbc:postgresql://localhost:5432/myai
      PGVECTOR_DATASOURCE_USERNAME: admin
      PGVECTOR_DATASOURCE_PASSWORD: admin
      MYAI_AUTH_BOOTSTRAP_ADMIN_USERNAME: admin
      MYAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD: admin123
      MYAI_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Admin
      INGEST_WORKER_ENABLED: "false"
      INGEST_STORAGE_TYPE: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 赋予 mvnw 执行权限
        run: chmod +x ./mvnw

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: 启动后端服务（后台）
        run: ./mvnw spring-boot:run -B &
        env:
          INGEST_STORAGE_ROOT_DIR: /tmp/myai-e2e-storage

      - name: 等待后端就绪
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "后端已就绪"
              exit 0
            fi
            echo "等待后端启动... ($i/60)"
            sleep 2
          done
          echo "后端启动失败"
          exit 1

      - name: 运行 Playwright E2E 测试
        working-directory: web
        run: npx playwright test

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-报告
          path: web/playwright-report/
          retention-days: 7
