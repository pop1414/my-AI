      description: |
        归属 knowledge 子域；
        允许修改 name、description、status，不允许修改 kb_id；
        工作区所有者、管理员或知识库 KB_MANAGER 可编辑。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无编辑知识库权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/qa/ask:
    post:
      tags: [qa]
      summary: 文档问答（同步返回）
      description: |
        归属 qa 子域；
        V1 先提供同步一次性返回能力；
        SSE 流式版本仅做文档预留，暂不开放新接口；
        当前用户必须对目标知识库具备问答权限；
        召回结果会在生成前按文档授权过滤，过滤后若无可用内容则返回兜底回答，不返回 403。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: 问答成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '400':
          description: 参数非法（question 为空、topK 越界或知识库不存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无目标知识库问答权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 知识库已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfHeader:
      name: X-MYAI-CSRF
      in: header
      required: true
      schema:
        type: string
        enum: ['1']
      description: 写操作统一 CSRF Header，当前固定值为 `1`
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/CurrentUserResponse'

    CurrentUserResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        workspaceId:
          type: string
          example: default
        workspaceRole:
          type: string
          enum: [WORKSPACE_OWNER, WORKSPACE_ADMIN, WORKSPACE_MEMBER]
        capabilities:
          $ref: '#/components/schemas/CurrentUserCapabilitiesResponse'

    CurrentUserCapabilitiesResponse:
      type: object
      properties:
        canAccessDocumentList:
          type: boolean
        canUploadDocument:
          type: boolean
        canAccessKnowledge:
          type: boolean
        canAskQuestion:
          type: boolean
        canAccessAdmin:
          type: boolean

    WorkspaceMember:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        workspaceId:
          type: string
          example: default
        workspaceRole:
          type: string
          enum: [WORKSPACE_OWNER, WORKSPACE_ADMIN, WORKSPACE_MEMBER]
        membershipStatus:
          type: string
          enum: [ACTIVE]

    UpdateWorkspaceMemberRoleRequest:
      type: object
      required: [workspaceRole]
      properties:
        workspaceRole:
          type: string
          enum: [WORKSPACE_OWNER, WORKSPACE_ADMIN, WORKSPACE_MEMBER]

    KnowledgeBaseGrant:
      type: object
      properties:
        workspaceId:
          type: string
          example: default
        kbId:
          type: string
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [KB_MANAGER, KB_CONTRIBUTOR, KB_READER, KB_ASKER]
        status:
          type: string
          enum: [ACTIVE]

    UpsertKnowledgeBaseGrantRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [KB_MANAGER, KB_CONTRIBUTOR, KB_READER, KB_ASKER]

    DocumentGrant:
      type: object
      properties:
        workspaceId:
          type: string
          example: default
        documentId:
          type: string
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        permission:
          type: string
          enum: [DOC_ALLOW_READ, DOC_ALLOW_MANAGE, DOC_DENY]
        status:
          type: string
          enum: [ACTIVE]

    UpsertDocumentGrantRequest:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
          enum: [DOC_ALLOW_READ, DOC_ALLOW_MANAGE, DOC_DENY]

    AuditEventPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    AuditEvent:
      type: object
      properties:
        auditEventId:
          type: integer
          format: int64
        workspaceId:
          type: string
          nullable: true
        actorUserId:
          type: string
          nullable: true
        actorUsername:
          type: string
          nullable: true
        eventType:
          type: string
        targetType:
          type: string
          nullable: true
        targetId:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [SUCCESS, FAILURE, DENIED]
        reason:
          type: string
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time

    UploadResponse:
      type: object
      properties:
        documentId:
          type: string
          description: 文档资产 ID（同一 kbId + fileHash 在未删除资产集合内保持稳定）
        status:
          type: string
          example: ACCEPTED

    DocumentStatusResponse:
      type: object
      properties:
        documentId:
          type: string
          description: 文档资产 ID
        latestVersionNumber:
          type: integer
          description: 当前 latest projection 指向的版本号
        latestFilename:
          type: string
          description: 当前 latest projection 指向版本的来源文件名
        latestVersionOriginType:
          type: string
          enum: [UPLOAD, ROLLBACK]
          description: 当前 latest projection 指向版本的来源类型
        status:
          type: string
          example: UPLOADED
        processingMetadata:
          allOf:
            - $ref: '#/components/schemas/ProcessingMetadata'
          nullable: true
          description: 仅 `INDEXED` / `FAILED` 终态允许返回的处理结果元数据

    DocumentVersionHistoryResponse:
      type: object
      required: [documentId, sort, versions]
      properties:
        documentId:
          type: string
          description: 文档资产 ID
        sort:
          type: string
          example: versionNumber,DESC
          description: 版本历史排序契约，当前固定为版本号倒序
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentVersionHistoryItem'

    DocumentVersionHistoryItem:
      type: object
      required:
        - documentId
        - versionNumber
        - versionOriginType
        - filename
        - fileSize
        - status
        - createdAt
        - updatedAt
        - isLatestVersion
        - isAskableVersion
      properties:
        documentId:
          type: string
          description: 文档资产 ID
        versionNumber:
          type: integer
          description: 版本号，从 1 开始递增
        versionOriginType:
          type: string
          enum: [UPLOAD, ROLLBACK]
          description: 版本来源类型
        rollbackFromVersionNumber:
          type: integer
          nullable: true
          description: 回退来源版本号，仅 ROLLBACK 版本有值
        filename:
          type: string
          description: 该版本来源文件名
        fileSize:
          type: integer
          format: int64
          description: 该版本文件大小，单位字节
        status:
          type: string
          enum: [UPLOADED, INGESTING, INDEXED, FAILED, DELETING, DELETED]
          description: 该版本处理状态
        failureReason:
          type: string
          nullable: true
          description: 仅 FAILED 状态返回失败原因，其余状态返回 null
        createdAt:
          type: string
          format: date-time
          description: 版本创建时间
        updatedAt:
          type: string
          format: date-time
          description: 版本更新时间
        isLatestVersion:
          type: boolean
          description: 是否为当前 latest projection 指向版本
        isAskableVersion:
          type: boolean
          description: 是否为当前 QA 基线使用的版本；优先 latest + INDEXED，否则回退到最近一个已 INDEXED 的历史版本；不持久化

    DocumentVersionUploadResponse:
      type: object
      required:
        - documentId
        - versionCreated
        - versionResultType
        - latestVersionNumber
        - canAskNow
        - status
        - versionOriginType
      properties:
        documentId:
          type: string
          description: 文档资产 ID
        versionCreated:
          type: boolean
          description: 是否创建了新版本；同内容复用时为 false
        versionResultType:
          type: string
          enum: [CREATED, REUSED_IDENTICAL_CONTENT]
          description: 上传新版本结果分支
        versionNumber:
          type: integer
          nullable: true
          description: 新创建的版本号；同内容复用时为空
        previousVersionNumber:
          type: integer
          nullable: true
          description: 创建新版本前的最新版本号；同内容复用时等于当前最新版本号
        reusedLatestVersionNumber:
          type: integer
          nullable: true
          description: 同内容复用时仍停留的最新版本号；创建新版本时为空
        latestVersionNumber:
          type: integer
          description: 系统当前认定的最新版本号
        askableVersionNumber:
          type: integer
          nullable: true
          description: 当前 QA 基线实际使用的版本号；不存在可问答版本时为空
        canAskNow:
          type: boolean
          description: 当前是否存在可问答版本
        status:
          type: string
          enum: [UPLOADED, INGESTING, INDEXED, FAILED, DELETING, DELETED]
          description: 当前最新版本状态
        versionOriginType:
          type: string
          enum: [UPLOAD, ROLLBACK]
          description: 当前最新版本来源类型

    DocumentVersionRollbackResponse:
      type: object
      required:
        - documentId
        - versionNumber
        - rollbackFromVersionNumber
        - latestVersionNumber
        - canAskNow
        - status
        - versionOriginType
      properties:
        documentId:
          type: string
          description: 文档资产 ID
        versionNumber:
          type: integer
          description: 回退创建的新最新版本号
        rollbackFromVersionNumber:
          type: integer
          description: 回退来源历史版本号
        latestVersionNumber:
          type: integer
          description: 系统当前认定的最新版本号，应等于 versionNumber
        askableVersionNumber:
          type: integer
          nullable: true
          description: 当前 QA 基线实际使用的版本号；不存在可问答版本时为空
        canAskNow:
          type: boolean
          description: 当前是否存在可问答版本
        status:
          type: string
          enum: [UPLOADED, INGESTING, INDEXED, FAILED, DELETING, DELETED]
          description: 当前最新版本状态；回退创建成功后初始为 UPLOADED
        versionOriginType:
          type: string
          enum: [ROLLBACK]
          description: 当前最新版本来源类型，回退成功时固定为 ROLLBACK

    ProcessingMetadata:
      type: object
      description: |
        文档级处理结果元数据；数据库字段 `ingest_documents.processing_metadata`
        为事实来源，状态接口仅在终态透传该对象。
      properties:
        schema_version:
          type: string
          example: v1
        stable:
          type: object
          additionalProperties: true
          description: 稳定输出字段集合，如 source_file、file_ext、mime_type、quality、created_at
        conditional:
          type: object
          additionalProperties: true
          description: 条件输出字段集合，如 language、page_count、primary_title、title_outline_sample
        best_effort:
          type: object
          additionalProperties: true
          description: 尽力而为字段集合，如 keywords
      additionalProperties: true

    DocumentListPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentListItemResponse'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    DocumentListItemResponse:
      type: object
      properties:
        documentId:
          type: string
        kbId:
          type: string
        filename:
          type: string
        fileSize:
          type: integer
          format: int64
        status:
          type: string
          enum: [UPLOADED, INGESTING, INDEXED, FAILED, DELETING, DELETED]
        failureReason:
          type: string
          nullable: true
          description: 仅 FAILED 状态时返回实际失败原因，其余状态返回 null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentChunksPreviewResponse:
      type: object
      properties:
        documentId:
          type: string
        chunkCount:
          type: integer
        totalChunks:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        previewChars:
          type: integer
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/DocumentChunkPreviewItem'

    DocumentChunkPreviewItem:
      type: object
      properties:
        chunkIndex:
          type: integer
        contentLength:
          type: integer
        contentPreview:
          type: string
        truncated:
          type: boolean
        sourceFile:
          type: string
        contentHash:
          type: string
        splitVersion:
          type: string
        sourceHint:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
          description: 知识库业务键 kb_id（服务端生成，对外稳定）
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        indexedDocumentCount:
          type: integer
          format: int64
          description: 已索引文档数量（status=INDEXED）

    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE

    UpdateKnowledgeBaseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        kbId:
          type: string
          default: default
        topK:
          type: integer
          default: 5
          minimum: 1
          maximum: 20

    AskResponse:
      type: object
      properties:
        answer:
          type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/AskReference'

    AskReference:
      type: object
      properties:
        documentId:
          type: string
        chunkIndex:
          type: integer
        contentPreview:
          type: string
