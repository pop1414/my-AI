openapi: 3.0.3
info:
  title: My-AI API
  version: 0.1.0
  description: |
    V1.1 接口契约（单用户、知识库主数据化基线）
servers:
  - url: http://localhost:8080

tags:
  - name: ingest
  - name: knowledge
  - name: qa

paths:
  /api/v1/documents/upload:
    post:
      tags: [ingest]
      summary: 上传文档并触发入库
      x-stage: implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                kbId:
                  type: string
                  description: 知识库业务键 kb_id（可选，默认 default；不存在返回 400，停用返回 409）
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: 参数非法或知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 知识库已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}/status:
    get:
      tags: [ingest]
      summary: 查询文档处理状态
      x-stage: implemented
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID（同一 kbId + fileHash 在未删除资产集合内保持稳定）
      responses:
        '200':
          description: 查询成功（文档删除后返回 DELETED，不返回 404）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}/chunks/preview:
    get:
      tags: [ingest]
      summary: 查询文档分块预览（调试）
      x-stage: implemented
      description: |
        用于验证“向量化前分块内容”是否符合预期。
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
          description: 最大返回分块数
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 100000
          description: 分页偏移量
        - name: previewChars
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 20
            maximum: 2000
          description: 单个分块预览字符数
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentChunksPreviewResponse'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}/reprocess:
    post:
      tags: [ingest]
      summary: 手动触发文档重处理
      x-stage: implemented
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID（重处理不会改变该 ID）
      responses:
        '200':
          description: 重处理已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 当前状态不允许重处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}:
    delete:
      tags: [ingest]
      summary: 删除文档资产
      x-stage: implemented
      description: |
        软删除文档资产，清理源文件与该 documentId 的全部向量版本；
        删除成功后可通过 status 接口查询到 DELETED。
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功（或已删除，幂等成功）
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 文档状态冲突（INGESTING/DELETING）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 删除执行失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/knowledge-bases:
    post:
      tags: [knowledge]
      summary: 创建知识库
      description: |
        归属 knowledge 子域；
        服务端生成对外业务键 kb_id，客户端只提交 name/description/status。
      x-stage: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [knowledge]
      summary: 查询知识库列表
      description: |
        归属 knowledge 子域；
        返回知识库主数据与已索引文档数量，统计口径固定为 status=INDEXED。
      x-stage: implemented
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'

  /api/v1/knowledge-bases/{kbId}:
    patch:
      tags: [knowledge]
      summary: 编辑知识库
      description: |
        归属 knowledge 子域；
        允许修改 name、description、status，不允许修改 kb_id。
      x-stage: implemented
      parameters:
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/qa/ask:
    post:
      tags: [qa]
      summary: 文档问答（同步返回）
      description: |
        归属 qa 子域；
        V1 先提供同步一次性返回能力；
        SSE 流式版本仅做文档预留，暂不开放新接口。
      x-stage: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: 问答成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '400':
          description: 参数非法（question 为空、topK 越界或知识库不存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 知识库已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    UploadResponse:
      type: object
      properties:
        documentId:
          type: string
          description: 文档资产 ID（同一 kbId + fileHash 在未删除资产集合内保持稳定）
        status:
          type: string
          example: ACCEPTED

    DocumentStatusResponse:
      type: object
      properties:
        documentId:
          type: string
          description: 文档资产 ID
        status:
          type: string
          example: UPLOADED

    DocumentChunksPreviewResponse:
      type: object
      properties:
        documentId:
          type: string
        chunkCount:
          type: integer
        totalChunks:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        previewChars:
          type: integer
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/DocumentChunkPreviewItem'

    DocumentChunkPreviewItem:
      type: object
      properties:
        chunkIndex:
          type: integer
        contentLength:
          type: integer
        contentPreview:
          type: string
        truncated:
          type: boolean
        sourceFile:
          type: string
        contentHash:
          type: string
        splitVersion:
          type: string
        sourceHint:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
          description: 知识库业务键 kb_id（服务端生成，对外稳定）
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        indexedDocumentCount:
          type: integer
          format: int64
          description: 已索引文档数量（status=INDEXED）

    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE

    UpdateKnowledgeBaseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        kbId:
          type: string
          default: default
        topK:
          type: integer
          default: 5
          minimum: 1
          maximum: 20

    AskResponse:
      type: object
      properties:
        answer:
          type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/AskReference'

    AskReference:
      type: object
      properties:
        documentId:
          type: string
        chunkIndex:
          type: integer
        contentPreview:
          type: string
