  /api/v1/documents/{documentId}/versions:
    get:
      tags: [ingest]
      summary: 查询文档版本历史
      x-stage: implemented
      description: |
        当前用户必须对目标文档具备管理权限；
        支持工作区所有者/管理员、知识库 `KB_MANAGER` 授权，以及文档级 `DOC_ALLOW_MANAGE`。
        响应按 `versionNumber DESC` 稳定排序。

        `isLatestVersion` 由 `ingest_documents.latest_version_number` 与版本号比较推导；
        `isAskableVersion` 不持久化，由当前 QA 基线推导：优先使用已 `INDEXED` 的最新版本；
        当最新版本尚未 `INDEXED` 时，回退到最近一个已 `INDEXED` 的历史版本；若不存在已 `INDEXED` 版本则全部为 false。
        历史版本查询只读取版本事实，不修改 latest projection，也不改变 QA 可问答基线。
      security:
        - cookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionHistoryResponse'
        '400':
          description: documentId 为空或非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无目标文档读取权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [ingest]
      summary: 上传既有 document 的新版本
      x-stage: implemented
      description: |
        该接口只服务文档详情页的“上传新版本”流程，不复用通用上传接口。
        目标 document 由路径参数绑定，目标知识库不可在此流程中切换。

        当前用户必须具备目标 document 管理权限；当前最新版本仅允许为 `INDEXED` 或 `FAILED`。
        调用方必须提交 `expectedLatestVersionNumber`，用于防止基于过期详情页提交新版本。
        若新文件内容与当前最新版本完全相同，接口返回成功复用结果，不创建新版本。
      security:
        - cookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, expectedLatestVersionNumber]
              properties:
                file:
                  type: string
                  format: binary
                  description: 新版本来源文件
                expectedLatestVersionNumber:
                  type: integer
                  minimum: 1
                  description: 调用方页面看到的最新版本号
      responses:
        '200':
          description: 创建新版本或同内容复用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionUploadResponse'
        '400':
          description: 参数非法或文件为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无目标文档管理权限，code 为 VERSION_UPLOAD_NO_MANAGE_PERMISSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在，code 为 VERSION_UPLOAD_DOCUMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 状态不允许或 latest version 乐观并发冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}/versions/{versionNumber}/rollback:
    post:
      tags: [ingest]
      summary: 将指定历史版本回退为新的最新版本
      x-stage: implemented
      description: |
        该接口只服务文档详情页版本历史中的“回退为最新版本”治理动作。
        回退不会回拨旧版本指针，而是基于目标历史版本创建一个 `ROLLBACK`
        来源的新 latest 版本，并让新版本以 `UPLOADED` 状态重新进入 ingest 处理链路。

        当前用户必须具备目标 document 管理权限；回退目标必须是非 latest 的 `INDEXED`
        历史版本。调用方必须提交 `expectedLatestVersionNumber`，用于防止基于过期详情页提交回退。
      security:
        - cookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
        - name: versionNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 要回退到的历史版本号
        - name: expectedLatestVersionNumber
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: 调用方页面看到的最新版本号
      responses:
        '200':
          description: 版本回退成功并创建新的 latest 版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionRollbackResponse'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无目标文档管理权限，code 为 VERSION_ROLLBACK_NO_MANAGE_PERMISSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档或目标版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 状态不允许、目标版本不可回退或 latest version 乐观并发冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 回退来源版本文件缺失，code 为 VERSION_ROLLBACK_SOURCE_FILE_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

