openapi: 3.0.3
info:
  title: My-AI API
  version: 0.1.0
  description: |
    V1.1 接口契约（知识库主数据化 + 文档列表管理基线）

    RAG 权限体系阶段二开始后，除登录接口和健康检查外，`/api/v1/**` 默认需要
    `HttpOnly Cookie` 中的服务端 Session。所有写操作需要携带固定 Header：
    `X-MYAI-CSRF: 1`。
servers:
  - url: http://localhost:8080

tags:
  - name: auth
  - name: governance
  - name: ingest
  - name: knowledge
  - name: qa

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 本地账号登录
      description: |
        登录成功后创建服务端 Session，并通过 HttpOnly Cookie 维持认证态。
        当前 CSRF 基线要求该写操作携带 `X-MYAI-CSRF: 1`。
      x-stage: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 请求体为空或参数缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少 CSRF Header、账号停用或账号锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出当前 Session
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 登出成功
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 查询当前登录用户
      description: |
        返回当前登录用户的基础身份信息与前端菜单渲染所需的能力位。

        当前能力位采用嵌套对象 `capabilities` 返回，前端据此决定：
        - 一级菜单是否显示
        - 登录后的默认落点
        - 业务页无权限时跳转到哪个可访问页面
      x-stage: implemented
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members:
    get:
      tags: [governance]
      summary: 查询工作区有效成员列表
      description: |
        返回当前工作区内“有效成员”列表；
        当前有效成员口径固定为 `users.status=ACTIVE` 且 `workspace_memberships.status=ACTIVE`；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/role:
    patch:
      tags: [governance]
      summary: 调整工作区成员角色
      description: |
        调整目标有效成员在当前工作区内的角色；
        仅工作区所有者或管理员可访问；
        角色变更成功后应立即影响既有知识库、文档与问答访问控制结果。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceMemberRoleRequest'
      responses:
        '200':
          description: 调整成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '400':
          description: 请求体为空或角色值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/knowledge-bases/{kbId}/grants:
    get:
      tags: [governance]
      summary: 查询知识库 ACTIVE 授权列表
      description: |
        返回当前工作区内指定知识库的 ACTIVE 授权列表；
        当前列表口径固定为：
        - `knowledge_base_grants.status = ACTIVE`
        - 被授权用户 `users.status = ACTIVE`
        - 被授权成员关系 `workspace_memberships.status = ACTIVE`
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBaseGrant'
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无知识库授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-frontend-note: |
        前端知识库授权管理页采用“整表勾选 + 保存”交互，但保存时按成员差量调用
        `PUT /api/v1/admin/knowledge-bases/{kbId}/grants/{userId}` 与
        `DELETE /api/v1/admin/knowledge-bases/{kbId}/grants/{userId}`；
        当前资源维度不提供 `grants:batch` 接口。

  /api/v1/admin/knowledge-bases/{kbId}/grants/{userId}:
    put:
      tags: [governance]
      summary: 授予或更新知识库授权
      description: |
        为当前工作区内指定知识库授予或更新单个成员的知识库角色；
        授权对象必须是当前工作区有效成员；
        同一 `(workspace_id, kb_id, user_id)` 授权关系保持单一真源；
        授权变更后应立即影响既有知识库、文档与问答访问控制结果。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertKnowledgeBaseGrantRequest'
      responses:
        '200':
          description: 授权成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseGrant'
        '400':
          description: 请求体为空、路径参数非法或知识库角色值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无知识库授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在，或目标用户不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [governance]
      summary: 回收知识库授权
      description: |
        回收当前工作区内指定知识库对单个成员的 ACTIVE 授权；
        回收成功后应立即影响既有知识库、文档与问答访问控制结果。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      responses:
        '204':
          description: 回收成功
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无知识库授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在或 ACTIVE 授权不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/documents/{documentId}/grants:
    get:
      tags: [governance]
      summary: 查询文档 ACTIVE 授权列表
      description: |
        返回当前工作区内指定文档的 ACTIVE 授权列表；
        当前列表口径固定为：
        - `document_grants.status = ACTIVE`
        - 被授权用户 `users.status = ACTIVE`
        - 被授权成员关系 `workspace_memberships.status = ACTIVE`
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentGrant'
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无文档授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-frontend-note: |
        前端文档授权管理页采用“整表勾选 + 保存”交互，但保存时按成员差量调用
        `PUT /api/v1/admin/documents/{documentId}/grants/{userId}` 与
        `DELETE /api/v1/admin/documents/{documentId}/grants/{userId}`；
        当前资源维度不提供 `grants:batch` 接口。

  /api/v1/admin/documents/{documentId}/grants/{userId}:
    put:
      tags: [governance]
      summary: 授予或更新文档授权
      description: |
        为当前工作区内指定文档授予或更新单个成员的文档级权限覆盖；
        授权对象必须是当前工作区有效成员；
        同一 `(workspace_id, document_id, user_id)` 授权关系保持单一真源；
        文档级覆盖继续遵循 `DOC_DENY` 最高优先级。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertDocumentGrantRequest'
      responses:
        '200':
          description: 授权成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentGrant'
        '400':
          description: 请求体为空、路径参数非法或文档权限值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无文档授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在，或目标用户不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [governance]
      summary: 回收文档授权
      description: |
        回收当前工作区内指定文档对单个成员的 ACTIVE 授权；
        回收成功后应立即影响既有文档列表、文档读取与问答过滤结果。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      responses:
        '204':
          description: 回收成功
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无文档授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在或 ACTIVE 授权不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/knowledge-base-grants:
    get:
      tags: [governance]
      summary: 查询成员维度知识库授权列表
      description: |
        返回指定有效成员在当前工作区下的知识库 ACTIVE 授权列表；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBaseGrant'
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/knowledge-base-grants:batch:
    put:
      tags: [governance]
      summary: 批量覆盖成员维度知识库授权
      description: |
        以“成员”为维度整体替换其知识库授权集合；
        不在请求列表中的现有 ACTIVE 授权将被回收；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [kbId, role]
                    properties:
                      kbId:
                        type: string
                      role:
                        type: string
                        enum: [KB_MANAGER, KB_CONTRIBUTOR, KB_READER, KB_ASKER]
      responses:
        '200':
          description: 覆盖成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBaseGrant'
        '400':
          description: 请求体为空、路径参数非法或角色值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/document-grants:
    get:
      tags: [governance]
      summary: 查询成员维度文档授权列表
      description: |
        返回指定有效成员在当前工作区下的文档 ACTIVE 授权列表；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentGrant'
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/document-grants:batch:
    put:
      tags: [governance]
      summary: 批量覆盖成员维度文档授权
      description: |
        以“成员”为维度整体替换其文档授权集合；
        不在请求列表中的现有 ACTIVE 授权将被回收；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [documentId, permission]
                    properties:
                      documentId:
                        type: string
                      permission:
                        type: string
                        enum: [DOC_ALLOW_READ, DOC_ALLOW_MANAGE, DOC_DENY]
      responses:
        '200':
          description: 覆盖成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentGrant'
        '400':
          description: 请求体为空、路径参数非法或权限值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/audit-events:
    get:
      tags: [governance]
      summary: 查询审计事件分页列表
      description: |
        返回当前工作区内的审计事件分页结果；
        默认按 `occurredAt DESC, auditEventId DESC` 排序；
        支持按事件类型、操作者、目标类型、目标 ID、结果代码与时间范围过滤；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: eventType
          in: query
          required: false
          schema:
            type: string
          description: 事件类型过滤，如 `LOGIN_SUCCESS`、`DOCUMENT_GRANT_UPSERTED`
        - name: actorUserId
          in: query
          required: false
          schema:
            type: string
          description: 操作者用户 ID 过滤
        - name: targetType
          in: query
          required: false
          schema:
            type: string
          description: 目标类型过滤，如 `USER`、`WORKSPACE_MEMBERSHIP`、`KNOWLEDGE_BASE_GRANT`、`DOCUMENT_GRANT`
        - name: targetId
          in: query
          required: false
          schema:
            type: string
          description: 目标 ID 过滤
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [SUCCESS, FAILURE, DENIED]
          description: 结果代码过滤
        - name: occurredFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 起始时间（含）
        - name: occurredTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 结束时间（含）
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: 分页偏移量
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPageResponse'
        '400':
          description: 查询参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无审计查询权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents:
    get:
      tags: [ingest]
      summary: 查询文档分页列表
      description: |
        返回文档管理台所需的分页结果；
        默认按 `createdAt DESC` 排序；
        当未传 `status` 时，默认排除 `DELETED`；
        查询范围限定在当前用户所属工作区，并对结果按知识库授权与文档级覆盖做可读过滤。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: kbId
          in: query
          required: false
          schema:
            type: string
          description: 知识库业务键 kb_id；传入不存在值时返回空列表而非 400
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [UPLOADED, INGESTING, INDEXED, FAILED, DELETING, DELETED]
          description: 不传时默认排除 DELETED；显式传 DELETED 时仅查询已删除文档
        - name: filename
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: 文件名模糊匹配
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: 分页偏移量
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListPageResponse'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无文档读取权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/upload:
    post:
      tags: [ingest]
      summary: 上传文档并触发入库
      description: |
        上传文档并受理入库；当前用户必须对目标知识库具备贡献权限
        （工作区所有者/管理员、KB_MANAGER 或 KB_CONTRIBUTOR）。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                kbId:
                  type: string
                  description: 知识库业务键 kb_id（可选，默认 default；不存在返回 400，停用返回 409）
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: 参数非法或知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无目标知识库贡献权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 知识库已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}/status:
    get:
      tags: [ingest]
      summary: 查询文档处理状态
      x-stage: implemented
      description: |
        当前用户必须对目标文档具备读取权限；
        支持工作区所有者/管理员、知识库读取授权，以及文档级 `DOC_ALLOW_READ` / `DOC_ALLOW_MANAGE`。
      security:
        - cookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID（同一 kbId + fileHash 在未删除资产集合内保持稳定）
      responses:
        '200':
          description: 查询成功（文档删除后返回 DELETED，不返回 404）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无目标文档读取权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}/chunks/preview:
    get:
      tags: [ingest]
      summary: 查询文档分块预览（调试）
      x-stage: implemented
      description: |
        用于验证“向量化前分块内容”是否符合预期；
        当前用户必须对目标文档具备读取权限。
      security:
        - cookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
          description: 最大返回分块数
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 100000
          description: 分页偏移量
        - name: previewChars
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 20
            maximum: 2000
          description: 单个分块预览字符数
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentChunksPreviewResponse'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无目标文档读取权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}/reprocess:
    post:
      tags: [ingest]
      summary: 手动触发文档重处理
      x-stage: implemented
      description: |
        当前用户必须对目标文档所属知识库具备贡献权限，
        即工作区所有者/管理员、KB_MANAGER 或 KB_CONTRIBUTOR。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID（重处理不会改变该 ID）
      responses:
        '200':
          description: 重处理已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无目标知识库贡献权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 当前状态不允许重处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/{documentId}:
    delete:
      tags: [ingest]
      summary: 删除文档资产
      x-stage: implemented
      description: |
        软删除文档资产，清理源文件与该 documentId 的全部向量版本；
        删除成功后可通过 status 接口查询到 DELETED；
        当前用户必须对目标文档具备管理权限。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功（或已删除，幂等成功）
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无目标文档管理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 文档状态冲突（INGESTING/DELETING）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 删除执行失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/knowledge-bases:
    post:
      tags: [knowledge]
      summary: 创建知识库
      description: |
        归属 knowledge 子域；
        服务端生成对外业务键 kb_id，客户端只提交 name/description/status；
        仅工作区所有者或管理员可创建知识库。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无创建知识库权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [knowledge]
      summary: 查询知识库列表
      description: |
        归属 knowledge 子域；
        返回当前用户可见的知识库主数据与已索引文档数量，统计口径固定为 status=INDEXED。

        当前可见性规则固定为：
        - `WORKSPACE_OWNER / WORKSPACE_ADMIN`：返回当前工作区全部知识库
        - `WORKSPACE_MEMBER`：仅返回当前用户存在 `knowledge_base_grants.status = ACTIVE`
          显式授权的知识库
      x-stage: implemented
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/knowledge-bases/{kbId}:
    patch:
      tags: [knowledge]
      summary: 编辑知识库
      description: |
        归属 knowledge 子域；
        允许修改 name、description、status，不允许修改 kb_id；
        工作区所有者、管理员或知识库 KB_MANAGER 可编辑。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无编辑知识库权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/qa/ask:
    post:
      tags: [qa]
      summary: 文档问答（同步返回）
      description: |
        归属 qa 子域；
        V1 先提供同步一次性返回能力；
        SSE 流式版本仅做文档预留，暂不开放新接口；
        当前用户必须对目标知识库具备问答权限；
        召回结果会在生成前按文档授权过滤，过滤后若无可用内容则返回兜底回答，不返回 403。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: 问答成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '400':
          description: 参数非法（question 为空、topK 越界或知识库不存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无目标知识库问答权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 知识库已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    CsrfHeader:
      name: X-MYAI-CSRF
      in: header
      required: true
      schema:
        type: string
        enum: ['1']
      description: 写操作统一 CSRF Header，当前固定值为 `1`
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/CurrentUserResponse'

    CurrentUserResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        workspaceId:
          type: string
          example: default
        workspaceRole:
          type: string
          enum: [WORKSPACE_OWNER, WORKSPACE_ADMIN, WORKSPACE_MEMBER]
        capabilities:
          $ref: '#/components/schemas/CurrentUserCapabilitiesResponse'

    CurrentUserCapabilitiesResponse:
      type: object
      properties:
        canAccessDocumentList:
          type: boolean
        canUploadDocument:
          type: boolean
        canAccessKnowledge:
          type: boolean
        canAskQuestion:
          type: boolean
        canAccessAdmin:
          type: boolean

    WorkspaceMember:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        workspaceId:
          type: string
          example: default
        workspaceRole:
          type: string
          enum: [WORKSPACE_OWNER, WORKSPACE_ADMIN, WORKSPACE_MEMBER]
        membershipStatus:
          type: string
          enum: [ACTIVE]

    UpdateWorkspaceMemberRoleRequest:
      type: object
      required: [workspaceRole]
      properties:
        workspaceRole:
          type: string
          enum: [WORKSPACE_OWNER, WORKSPACE_ADMIN, WORKSPACE_MEMBER]

    KnowledgeBaseGrant:
      type: object
      properties:
        workspaceId:
          type: string
          example: default
        kbId:
          type: string
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [KB_MANAGER, KB_CONTRIBUTOR, KB_READER, KB_ASKER]
        status:
          type: string
          enum: [ACTIVE]

    UpsertKnowledgeBaseGrantRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [KB_MANAGER, KB_CONTRIBUTOR, KB_READER, KB_ASKER]

    DocumentGrant:
      type: object
      properties:
        workspaceId:
          type: string
          example: default
        documentId:
          type: string
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        permission:
          type: string
          enum: [DOC_ALLOW_READ, DOC_ALLOW_MANAGE, DOC_DENY]
        status:
          type: string
          enum: [ACTIVE]

    UpsertDocumentGrantRequest:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
          enum: [DOC_ALLOW_READ, DOC_ALLOW_MANAGE, DOC_DENY]

    AuditEventPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    AuditEvent:
      type: object
      properties:
        auditEventId:
          type: integer
          format: int64
        workspaceId:
          type: string
          nullable: true
        actorUserId:
          type: string
          nullable: true
        actorUsername:
          type: string
          nullable: true
        eventType:
          type: string
        targetType:
          type: string
          nullable: true
        targetId:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [SUCCESS, FAILURE, DENIED]
        reason:
          type: string
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time

    UploadResponse:
      type: object
      properties:
        documentId:
          type: string
          description: 文档资产 ID（同一 kbId + fileHash 在未删除资产集合内保持稳定）
        status:
          type: string
          example: ACCEPTED

    DocumentStatusResponse:
      type: object
      properties:
        documentId:
          type: string
          description: 文档资产 ID
        status:
          type: string
          example: UPLOADED

    DocumentListPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentListItemResponse'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    DocumentListItemResponse:
      type: object
      properties:
        documentId:
          type: string
        kbId:
          type: string
        filename:
          type: string
        fileSize:
          type: integer
          format: int64
        status:
          type: string
          enum: [UPLOADED, INGESTING, INDEXED, FAILED, DELETING, DELETED]
        failureReason:
          type: string
          nullable: true
          description: 仅 FAILED 状态时返回实际失败原因，其余状态返回 null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentChunksPreviewResponse:
      type: object
      properties:
        documentId:
          type: string
        chunkCount:
          type: integer
        totalChunks:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        previewChars:
          type: integer
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/DocumentChunkPreviewItem'

    DocumentChunkPreviewItem:
      type: object
      properties:
        chunkIndex:
          type: integer
        contentLength:
          type: integer
        contentPreview:
          type: string
        truncated:
          type: boolean
        sourceFile:
          type: string
        contentHash:
          type: string
        splitVersion:
          type: string
        sourceHint:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
          description: 知识库业务键 kb_id（服务端生成，对外稳定）
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        indexedDocumentCount:
          type: integer
          format: int64
          description: 已索引文档数量（status=INDEXED）

    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE

    UpdateKnowledgeBaseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        kbId:
          type: string
          default: default
        topK:
          type: integer
          default: 5
          minimum: 1
          maximum: 20

    AskResponse:
      type: object
      properties:
        answer:
          type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/AskReference'

    AskReference:
      type: object
      properties:
        documentId:
          type: string
        chunkIndex:
          type: integer
        contentPreview:
          type: string
