openapi: 3.0.3
info:
  title: My-AI API
  version: 0.1.0
  description: |
    V1.1 接口契约（知识库主数据化 + 文档列表管理基线）

    RAG 权限体系阶段二开始后，除登录接口和健康检查外，`/api/v1/**` 默认需要
    `HttpOnly Cookie` 中的服务端 Session。所有写操作需要携带固定 Header：
    `X-MYAI-CSRF: 1`。
servers:
  - url: http://localhost:8080

tags:
  - name: auth
  - name: governance
  - name: ingest
  - name: knowledge
  - name: qa

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 本地账号登录
      description: |
        登录成功后创建服务端 Session，并通过 HttpOnly Cookie 维持认证态。
        当前 CSRF 基线要求该写操作携带 `X-MYAI-CSRF: 1`。
      x-stage: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 请求体为空或参数缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少 CSRF Header、账号停用或账号锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出当前 Session
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 登出成功
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 查询当前登录用户
      description: |
        返回当前登录用户的基础身份信息与前端菜单渲染所需的能力位。

        当前能力位采用嵌套对象 `capabilities` 返回，前端据此决定：
        - 一级菜单是否显示
        - 登录后的默认落点
        - 业务页无权限时跳转到哪个可访问页面
      x-stage: implemented
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members:
    get:
      tags: [governance]
      summary: 查询工作区有效成员列表
      description: |
        返回当前工作区内“有效成员”列表；
        当前有效成员口径固定为 `users.status=ACTIVE` 且 `workspace_memberships.status=ACTIVE`；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/role:
    patch:
      tags: [governance]
      summary: 调整工作区成员角色
      description: |
        调整目标有效成员在当前工作区内的角色；
        仅工作区所有者或管理员可访问；
        角色变更成功后应立即影响既有知识库、文档与问答访问控制结果。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceMemberRoleRequest'
      responses:
        '200':
          description: 调整成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '400':
          description: 请求体为空或角色值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/knowledge-bases/{kbId}/grants:
    get:
      tags: [governance]
      summary: 查询知识库 ACTIVE 授权列表
      description: |
        返回当前工作区内指定知识库的 ACTIVE 授权列表；
        当前列表口径固定为：
        - `knowledge_base_grants.status = ACTIVE`
        - 被授权用户 `users.status = ACTIVE`
        - 被授权成员关系 `workspace_memberships.status = ACTIVE`
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBaseGrant'
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无知识库授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-frontend-note: |
        前端知识库授权管理页采用“整表勾选 + 保存”交互，但保存时按成员差量调用
        `PUT /api/v1/admin/knowledge-bases/{kbId}/grants/{userId}` 与
        `DELETE /api/v1/admin/knowledge-bases/{kbId}/grants/{userId}`；
        当前资源维度不提供 `grants:batch` 接口。

  /api/v1/admin/knowledge-bases/{kbId}/grants/{userId}:
    put:
      tags: [governance]
      summary: 授予或更新知识库授权
      description: |
        为当前工作区内指定知识库授予或更新单个成员的知识库角色；
        授权对象必须是当前工作区有效成员；
        同一 `(workspace_id, kb_id, user_id)` 授权关系保持单一真源；
        授权变更后应立即影响既有知识库、文档与问答访问控制结果。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertKnowledgeBaseGrantRequest'
      responses:
        '200':
          description: 授权成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseGrant'
        '400':
          description: 请求体为空、路径参数非法或知识库角色值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无知识库授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在，或目标用户不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [governance]
      summary: 回收知识库授权
      description: |
        回收当前工作区内指定知识库对单个成员的 ACTIVE 授权；
        回收成功后应立即影响既有知识库、文档与问答访问控制结果。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: kbId
          in: path
          required: true
          schema:
            type: string
          description: 知识库业务键 kb_id
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      responses:
        '204':
          description: 回收成功
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无知识库授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 知识库不存在或 ACTIVE 授权不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/documents/{documentId}/grants:
    get:
      tags: [governance]
      summary: 查询文档 ACTIVE 授权列表
      description: |
        返回当前工作区内指定文档的 ACTIVE 授权列表；
        当前列表口径固定为：
        - `document_grants.status = ACTIVE`
        - 被授权用户 `users.status = ACTIVE`
        - 被授权成员关系 `workspace_memberships.status = ACTIVE`
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentGrant'
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无文档授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-frontend-note: |
        前端文档授权管理页采用“整表勾选 + 保存”交互，但保存时按成员差量调用
        `PUT /api/v1/admin/documents/{documentId}/grants/{userId}` 与
        `DELETE /api/v1/admin/documents/{documentId}/grants/{userId}`；
        当前资源维度不提供 `grants:batch` 接口。

  /api/v1/admin/documents/{documentId}/grants/{userId}:
    put:
      tags: [governance]
      summary: 授予或更新文档授权
      description: |
        为当前工作区内指定文档授予或更新单个成员的文档级权限覆盖；
        授权对象必须是当前工作区有效成员；
        同一 `(workspace_id, document_id, user_id)` 授权关系保持单一真源；
        文档级覆盖继续遵循 `DOC_DENY` 最高优先级。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertDocumentGrantRequest'
      responses:
        '200':
          description: 授权成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentGrant'
        '400':
          description: 请求体为空、路径参数非法或文档权限值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无文档授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在，或目标用户不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [governance]
      summary: 回收文档授权
      description: |
        回收当前工作区内指定文档对单个成员的 ACTIVE 授权；
        回收成功后应立即影响既有文档列表、文档读取与问答过滤结果。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: 文档资产 ID
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      responses:
        '204':
          description: 回收成功
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无文档授权治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文档不存在或 ACTIVE 授权不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/knowledge-base-grants:
    get:
      tags: [governance]
      summary: 查询成员维度知识库授权列表
      description: |
        返回指定有效成员在当前工作区下的知识库 ACTIVE 授权列表；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBaseGrant'
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/knowledge-base-grants:batch:
    put:
      tags: [governance]
      summary: 批量覆盖成员维度知识库授权
      description: |
        以“成员”为维度整体替换其知识库授权集合；
        不在请求列表中的现有 ACTIVE 授权将被回收；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [kbId, role]
                    properties:
                      kbId:
                        type: string
                      role:
                        type: string
                        enum: [KB_MANAGER, KB_CONTRIBUTOR, KB_READER, KB_ASKER]
      responses:
        '200':
          description: 覆盖成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBaseGrant'
        '400':
          description: 请求体为空、路径参数非法或角色值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 缺少或非法 CSRF Header，或当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/document-grants:
    get:
      tags: [governance]
      summary: 查询成员维度文档授权列表
      description: |
        返回指定有效成员在当前工作区下的文档 ACTIVE 授权列表；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentGrant'
        '400':
          description: 路径参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 当前用户无成员治理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 目标成员不存在或不是当前工作区有效成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/members/{userId}/document-grants:batch:
    put:
      tags: [governance]
      summary: 批量覆盖成员维度文档授权
      description: |
        以“成员”为维度整体替换其文档授权集合；
        不在请求列表中的现有 ACTIVE 授权将被回收；
        仅工作区所有者或管理员可访问。
      x-stage: implemented
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: 目标成员用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [documentId, permission]
                    properties:
                      documentId:
                        type: string
                      permission:
                        type: string
                        enum: [DOC_ALLOW_READ, DOC_ALLOW_MANAGE, DOC_DENY]
      responses:
        '200':
          description: 覆盖成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentGrant'
        '400':
          description: 请求体为空、路径参数非法或权限值非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
